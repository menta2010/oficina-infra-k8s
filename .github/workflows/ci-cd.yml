name: CI/CD

# PR: fmt + validate + plan | develop -> apply em homolog | main -> apply em prod
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: infra-k8s-${{ github.ref }}
  cancel-in-progress: false   # nunca interromper um apply no meio

env:
  TF_VERSION: '1.13.0'

jobs:
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Terraform plan (${{ github.base_ref == 'main' && 'prod' || 'homolog' }})
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'prod' || 'homolog' }}
    env:
      AMBIENTE: ${{ github.base_ref == 'main' && 'prod' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      TF_VAR_cluster_role_arn: ${{ vars.CLUSTER_ROLE_ARN }}
      TF_VAR_node_role_arn: ${{ vars.NODE_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform plan
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina/infra-k8s/${AMBIENTE}.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform plan -input=false -var="environment=${AMBIENTE}" -var="aws_region=${AWS_REGION}"

  apply:
    name: Terraform apply (${{ github.ref_name == 'main' && 'prod' || 'homolog' }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      TF_VAR_cluster_role_arn: ${{ vars.CLUSTER_ROLE_ARN }}
      TF_VAR_node_role_arn: ${{ vars.NODE_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform apply
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina/infra-k8s/${AMBIENTE}.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -input=false -var="environment=${AMBIENTE}" -var="aws_region=${AWS_REGION}"
      - name: Cluster e componentes de plataforma
        run: |
          aws eks update-kubeconfig --name "oficina-${AMBIENTE}-eks" --region "$AWS_REGION"
          kubectl get nodes -o wide
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=180s
          kubectl -n kube-system get deploy -l app.kubernetes.io/name=aws-cluster-autoscaler
          echo "API Gateway: $(terraform output -raw api_endpoint)"
